name: Laravel CI/CD

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    name: Build Laravel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, bcmath, pdo_sqlite
          coverage: none

      - name: Cache dependensi Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Pasang dependensi
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Siapkan environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ringkasan aplikasi
        run: php artisan about

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, bcmath, pdo_sqlite
          coverage: none

      - name: Cache dependensi Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # Butuh dependensi dev (PHPUnit), jadi tanpa --no-dev.
      - name: Pasang dependensi
        run: composer install --no-interaction --prefer-dist

      - name: Siapkan environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan test
        run: php artisan test

  staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Simulasi deploy ke staging
        run: |
          echo "Deploy ke staging (simulasi)"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

  production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: staging
    # Penjaga production: hanya push ke main, tidak pernah dari PR atau branch fitur.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Environment dengan required reviewer: job berhenti menunggu persetujuan manual.
    environment: production
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Jalankan skrip deploy
        run: bash deploy.sh
